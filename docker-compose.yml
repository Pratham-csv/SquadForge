# SquadForge full stack: Redis + API + React (nginx)
#
# Usage:
#   docker compose up --build
#   open http://localhost:3000
#
# Secrets come from server/.env (never commit real keys).
# REDIS_URL is overridden so the API container reaches Redis by service name.

services:
  redis:
    image: redis:7-alpine
    container_name: squadforge-redis
    # No host port publish — API reaches Redis as redis://redis:6379
    # on the Compose network. Avoids clashes with local Homebrew Redis.
    # To debug from your Mac: docker compose exec redis redis-cli ping
    command: redis-server --save "" --appendonly no
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: squadforge-server
    ports:
      - "5001:5001"
    env_file:
      - ./server/.env
    environment:
      # Inside Docker, Redis is the service name — not 127.0.0.1
      REDIS_URL: redis://redis:6379
      PORT: "5001"
      ORIGIN: http://localhost:3000
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:5001
        REACT_APP_LOCALHOST_KEY: squadforge-user
    container_name: squadforge-client
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped
